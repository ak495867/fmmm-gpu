[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmmm-gpu"
version = "0.1.0"
description = "CUDA FMMM layout seed engine with a small Python API"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
